[project]
name = "gameboygpt"
version = "0.1.0"
description = "A tiny causal transformer running on the original Game Boy's SM83 CPU, inside a playable adventure game."
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "pyboy>=2.4",
  "pytest>=8",
  "pillow>=10",
  "matplotlib>=3.8",
  "pyyaml>=6",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running emulator end-to-end tests"]
[tool.uv]
package = false
