[project]
name = "gameboygpt"
version = "0.4.0"
description = "SYSTEM OVERRIDE: a snarky robot character whose dialogue comes from a tiny transformer running on the original Game Boy's SM83 CPU."
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "pyboy>=2.4",
  "pytest>=8",
  "pillow>=10",
  "pyyaml>=6",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running emulator end-to-end tests"]
[tool.uv]
package = false
