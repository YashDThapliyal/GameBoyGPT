# Sibling of the release model with held-out situations removed. Reported, never shipped.
seed: 1234
threads: 1  # multithreaded runs were not byte-reproducible
n_train: 60000
n_eval: 4000
model: {ctx: 24, d: 32, heads: 2, ffn: 64, layers: 1}
batch: 256
lr: 0.004
weight_decay: 0.001
float_steps: 20000
qat_steps: 12000
eval_every: 2000
out: checkpoints/heldout.pt
