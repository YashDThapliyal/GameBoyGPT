# Shipping model. Chosen by the scaling study, see docs/EVALUATION.md.
seed: 1234
threads: 1  # multithreaded runs were not byte-reproducible
n_train: 120000
n_eval: 4000
model: {d: 32, heads: 2, ffn: 64, layers: 1, k: 16}
batch: 256
lr: 0.004
weight_decay: 0.001
float_steps: 24000
qat_steps: 14000
eval_every: 2000
out: checkpoints/release.pt
